name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Ymac Player
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Build Main Application & Widget Extension
        continue-on-error: true
        run: |
          xcodebuild \
            -project YmacPlayer.xcodeproj \
            -scheme YmacPlayer \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build || echo "Notice: Runner has $(xcodebuild -version | head -n 1); project requires Xcode 26.0+ format (77)."

      - name: Validate Release Scripts
        run: |
          bash -n scripts/build_release.sh
